<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rocket Ladders</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Fredoka:wght@500;700&display=swap">
<style>
/* Layout: board game. 6x5 snake board on the left, turn panel (dice, roll, scores) on the right; stacks on phones */
:root{
  --bg:#ffd166; --board:#fffaf0; --ink:#232038; --paper:#fffdf7;
  --a:#ffe9a8; --b:#cdeeff; --c:#ffd6e5; --d:#d9f5d6;
  --ladder:#2e9e5b; --slide:#f0742b; --star:#7b5cff; --party:#ff4f8b;
  --display:"Fredoka","Comic Neue",system-ui,sans-serif;
  --read:"Comic Neue","Comic Sans MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--read);padding-inline:16px;padding-block:10px 24px;
  background-image:radial-gradient(circle at 10px 10px,rgba(255,255,255,.35) 3px,transparent 4px);background-size:34px 34px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:clamp(1.6rem,4.6vw,2.5rem);margin:0}
.btn{font-family:var(--display);background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:4px 10px;font-size:1.05rem;cursor:pointer;color:var(--ink)}
button:focus-visible{outline:4px solid var(--star);outline-offset:3px}
.game{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.board{flex:1 1 560px;min-width:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;background:var(--board);border:4px solid var(--ink);border-radius:18px;padding:8px;box-shadow:0 6px 0 var(--ink)}
.sq{position:relative;aspect-ratio:1/0.82;border:2px solid var(--ink);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;overflow:hidden}
.sq .n{position:absolute;top:2px;left:5px;font-family:var(--display);font-size:clamp(.7rem,1.8vw,.95rem)}
.sq .ic{font-size:clamp(1rem,3.2vw,1.7rem);line-height:1}
.sq .to{font-family:var(--display);font-size:clamp(.65rem,1.7vw,.9rem);font-weight:700}
.sq.ladder{background:#c8f0d6!important;border-color:var(--ladder)}
.sq.slide{background:#ffd9c2!important;border-color:var(--slide)}
.sq.star{background:#e3dbff!important}
.sq.party{background:#ffd3e3!important}
.sq.fin{background:repeating-conic-gradient(var(--ink) 0 25%,#fff 0 50%) 0 0/16px 16px!important}
.sq.fin .ic{background:#fff;border-radius:8px;padding:2px}
.pawns{position:absolute;bottom:2px;right:3px;display:flex;font-size:clamp(1.1rem,3.4vw,1.9rem);line-height:1}
.pawns span{filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.pawns span.hop{animation:hop .22s ease}

.panel{flex:1 1 260px;display:flex;flex-direction:column;gap:12px;background:var(--paper);border:4px solid var(--ink);border-radius:18px;padding:14px;box-shadow:0 6px 0 var(--ink)}
.turn{font-family:var(--display);font-size:clamp(1.3rem,3.4vw,1.7rem);text-align:center}
.dice{font-size:clamp(4rem,12vw,6rem);line-height:1;text-align:center}
.dice.roll{animation:spin .7s linear}
.big{font-family:var(--display);font-weight:700;font-size:clamp(1.15rem,3.2vw,1.5rem);border:4px solid var(--ink);border-radius:14px;padding:10px 20px;cursor:pointer;color:var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink)}
.big.go{background:var(--bg)}
.big.yes{background:#bff0cf}
.big.on{background:#e3dbff}
.big:active{transform:translateY(4px);box-shadow:none}
.big:disabled{opacity:.5;cursor:default}
.players{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:12px;padding:4px 10px;font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.pl.now{background:#fff1b3}
.key{font-size:.95rem;color:#5d5870;margin:0;line-height:1.5}

.overlay{position:fixed;inset:0;background:rgba(35,32,56,.6);display:grid;place-items:center;padding:16px;z-index:20}
.pop{background:var(--paper);border:4px solid var(--ink);border-radius:24px;padding:22px;max-width:580px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;animation:popin .35s ease;max-height:92vh;overflow:auto}
.pop h2{font-family:var(--display);font-size:clamp(1.6rem,4.6vw,2.2rem);margin:0;text-wrap:balance}
.pop p{margin:0;font-size:clamp(1.1rem,3vw,1.35rem);font-weight:700}
.word{font-family:var(--read);font-weight:700;font-size:clamp(3.2rem,12vw,6.4rem);line-height:1.1;background:#fff;border:4px solid var(--ink);border-radius:16px;padding:.05em .4em;align-self:center;animation:popin .35s ease}
.boxes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.boxes span{font-weight:700;font-size:clamp(1.6rem,5vw,2.4rem);border:3px solid var(--ink);border-radius:10px;padding:0 .35em;background:#e3dbff;animation:popin .3s ease both}
.boxes span.sil{background:#eee;color:#888}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.timer{font-family:var(--display);font-size:3rem;color:var(--party);font-variant-numeric:tabular-nums}
.move{font-size:3.4rem;line-height:1}
.help{font-size:1rem!important;font-weight:400!important;color:#5d5870}
.setup{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;text-align:left}
.setup input{font-family:var(--read);font-weight:700;font-size:1.1rem;border:3px solid var(--ink);border-radius:10px;padding:6px 10px;min-width:0;width:100%}
label.h{font-family:var(--display);text-align:left;font-size:1.1rem}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:.95rem;border-radius:12px;border:3px solid var(--ink);padding:10px;color:var(--ink);background:#fff}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
@keyframes hop{0%{translate:0 0}50%{translate:0 -12px}100%{translate:0 0}}
@keyframes spin{0%{rotate:0deg}100%{rotate:720deg}}
@keyframes popin{0%{scale:.75}60%{scale:1.06}100%{scale:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <header>
    <h1>🚀 Rocket Ladders</h1>
    <div class="row">
      <button class="btn" id="newg">↺ New game</button>
      <button class="btn" id="snd" aria-label="Sound effects on or off">🔊</button>
      <button class="btn" id="teach" aria-label="Teacher setup">⚙️</button>
    </div>
  </header>
  <div class="game">
    <div class="board" id="board" aria-label="Game board"></div>
    <aside class="panel">
      <div class="turn" id="turn"></div>
      <div class="dice" id="dice">🎲</div>
      <button class="big go" id="roll">🎲 Roll!</button>
      <div class="players" id="players"></div>
      <p class="key">🪜 Read it to climb up<br>🛝 Read it to dodge the slide<br>⭐ Sound Tap: say each sound<br>🎉 Wiggle break<br>🎲 Roll a 6 = go again!</p>
    </aside>
  </div>
</div>
<div class="overlay" id="ov" hidden><div class="pop" id="pop"></div></div>

<script>
const READ_DEFAULT=`humid, duty, humor, unite, pupil, cupid, student, study, punish, music, hour, honest, phone, graph`;
const TAP_DEFAULT=`student = s t u d e n t
study = s t u d y
punish = p u n i sh
music = m u s i c
hour = (h) ou r
honest = (h) o n e s t
phone = ph o_e n
graph = g r a ph`;
const LADDERS={3:12,9:18,16:25}, SLIDES={14:5,22:13,28:19}, PARTY=[7,20,26], STARS=[10,17,24,29], FINISH=30;
const ICONS=["🚀","🛸","🦖","🐱","🦄","🐶","🤖","🐸"];
const BREAKS=[["🚀","Blast off! Crouch down, count 3-2-1, and JUMP!"],["🧑‍🚀","Moon walk! Slow, floaty steps in place for 10 seconds."],["🌀","Spin like a planet! Turn around slowly 3 times."],
  ["💃","Wiggle dance! Dance until the timer hits 5."],["🤸","Star jumps! 5 big ones."],["🦩","Flamingo! Stand on one foot and count to 10."]];
const FACES=["⚀","⚁","⚂","⚃","⚄","⚅"];
const COLORS=["var(--a)","var(--b)","var(--c)","var(--d)"];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

let sound=true, actx=null;
function beep(n){ if(!sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); let t=actx.currentTime;
  n.forEach(([f,d,ty])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=ty||"triangle";o.frequency.value=f;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d);t+=d*.8;});}catch(e){} }
const sfx={step:i=>beep([[440+i*40,.06,"sine"]]),dice:()=>beep([[300,.03,"square"],[350,.03,"square"],[300,.03,"square"],[400,.03,"square"]]),
  up:()=>beep([[400,.08],[500,.08],[600,.08],[800,.08],[1000,.2]]),down:()=>beep([[900,.08,"sawtooth"],[700,.08,"sawtooth"],[500,.08,"sawtooth"],[300,.2,"sawtooth"]]),
  good:()=>beep([[660,.08],[990,.16]]),win:()=>beep([[523,.12],[659,.12],[784,.12],[1047,.4]])};

let readRaw=READ_DEFAULT, tapRaw=TAP_DEFAULT;
try{const a=localStorage.getItem("rl-read");if(a)readRaw=a;const b=localStorage.getItem("rl-tap");if(b)tapRaw=b;}catch(e){}
const parseRead=t=>[...new Set(t.split(/[\s,]+/).map(w=>w.trim()).filter(Boolean))];
const parseTap=t=>t.split("\n").map(l=>l.trim()).filter(l=>l.includes("=")).map(l=>{const k=l.indexOf("=");return {word:l.slice(0,k).trim(),sounds:l.slice(k+1).trim().split(/\s+/).filter(Boolean)}}).filter(x=>x.word&&x.sounds.length);
let readWords=parseRead(readRaw), tapWords=parseTap(tapRaw);

let players=[{name:"Student",icon:"🚀",pos:1,stars:0},{name:"Teacher",icon:"🛸",pos:1,stars:0}], count=2, turn=0, busy=false, squareWord={}, tapQueue=[], over=false;

function order(){const o=[];for(let r=0;r<5;r++){const b=4-r;let row=[];for(let c=1;c<=6;c++) row.push(b*6+c); if(b%2===1) row.reverse(); o.push(...row);}return o;}
function drawBoard(){
  const bd=$("board"); bd.innerHTML="";
  order().forEach(n=>{const d=document.createElement("div");d.className="sq";d.id="c"+n;d.style.background=COLORS[n%4];
    let ic="",to="";
    if(n===FINISH){d.classList.add("fin");ic="🏁";}
    else if(n===1){ic="🛫";to="START";}
    else if(LADDERS[n]){d.classList.add("ladder");ic="🪜";to="up to "+LADDERS[n];}
    else if(SLIDES[n]){d.classList.add("slide");ic="🛝";to="down to "+SLIDES[n];}
    else if(STARS.includes(n)){d.classList.add("star");ic="⭐";}
    else if(PARTY.includes(n)){d.classList.add("party");ic="🎉";}
    else ic="📖";
    d.innerHTML=`<span class="n">${n}</span><span class="ic">${ic}</span>${to?`<span class="to">${to}</span>`:""}<span class="pawns"></span>`;
    bd.appendChild(d);});
  drawPawns();
}
function drawPawns(hopIdx){
  document.querySelectorAll(".pawns").forEach(p=>p.innerHTML="");
  players.slice(0,count).forEach((p,i)=>{const s=document.createElement("span");s.textContent=p.icon;if(i===hopIdx)s.className="hop";$("c"+p.pos).querySelector(".pawns").appendChild(s);});
}
function drawPanel(){
  const p=players[turn];
  $("turn").textContent=over?"Game over!":`${p.icon} ${p.name}'s turn`;
  $("players").innerHTML=players.slice(0,count).map((q,i)=>`<div class="pl ${i===turn&&!over?"now":""}"><span>${q.icon} ${esc(q.name)}</span><span>square ${q.pos} · ⭐ ${q.stars}</span></div>`).join("");
  $("roll").disabled=busy||over;
}
function nextReadWord(n){ if(!squareWord[n]){ const used=Object.values(squareWord); const pool=readWords.filter(w=>!used.includes(w)); squareWord[n]=pick(pool.length?pool:readWords); } return squareWord[n]; }
function nextTap(){ if(!tapQueue.length) tapQueue=shuffle(tapWords); return tapQueue.pop(); }

async function roll(){
  if(busy||over) return; busy=true; drawPanel();
  const dice=$("dice"); dice.classList.remove("roll"); void dice.offsetWidth; dice.classList.add("roll");
  for(let i=0;i<7;i++){ dice.textContent=pick(FACES); sfx.dice(); await sleep(90); }
  const d=1+Math.floor(Math.random()*6); dice.textContent=FACES[d-1];
  await sleep(250);
  const p=players[turn], dest=Math.min(FINISH,p.pos+d);
  while(p.pos<dest){ p.pos++; sfx.step(p.pos%8); drawPawns(turn); await sleep(230); }
  drawPanel();
  await resolve(p);
  if(over) return;
  const again=d===6;
  if(!again) turn=(turn+1)%count;
  busy=false; drawPanel();
  if(again) flash(`🎲 ${p.icon} rolled a 6. Roll again!`);
}
function flash(t){ $("turn").textContent=t; setTimeout(()=>{ if(!busy) drawPanel(); },1800); }

function card(html){ return new Promise(res=>{ showPop(html); document.querySelectorAll("#pop [data-r]").forEach(b=>b.onclick=()=>res(b.dataset.r)); }); }
async function resolve(p){
  const n=p.pos;
  if(n>=FINISH) return win(p);
  if(PARTY.includes(n)) { await breakCard(); closePop(); return; }
  if(STARS.includes(n)) return starCard(p);
  const w=nextReadWord(n);
  if(LADDERS[n]){
    const r=await card(`<h2>🪜 Read it to climb!</h2><div class="word">${esc(w)}</div>
      <div class="row"><button class="big" data-r="no">Not yet</button><button class="big yes" data-r="yes">✔ Read it!</button></div>`);
    closePop();
    if(r==="yes"){ p.stars++; sfx.up(); await jump(p,LADDERS[n]); confetti(80); }
    return;
  }
  if(SLIDES[n]){
    const r=await card(`<h2>🛝 Read it to dodge the slide!</h2><div class="word">${esc(w)}</div>
      <div class="row"><button class="big" data-r="no">Not yet</button><button class="big yes" data-r="yes">✔ Read it!</button></div>`);
    closePop();
    if(r==="yes"){ p.stars++; sfx.good(); flash("Dodged it! 😎"); } else { sfx.down(); await jump(p,SLIDES[n]); }
    return;
  }
  const r=await card(`<h2>📖 Read it!</h2><div class="word">${esc(w)}</div>
    <div class="row"><button class="big" data-r="no">Not yet</button><button class="big yes" data-r="yes">✔ Read it! +1 ⭐</button></div>`);
  closePop(); if(r==="yes"){ p.stars++; sfx.good(); }
}
async function jump(p,to){ const step=to>p.pos?1:-1; while(p.pos!==to){ p.pos+=step; drawPawns(players.indexOf(p)); await sleep(110); } drawPanel(); }
async function starCard(p){
  if(!tapWords.length){ return; }
  const t=nextTap();
  await card(`<h2>⭐ Sound Tap!</h2><p>Read it. Then tap one finger for each sound.</p><div class="word">${esc(t.word)}</div>
    <div class="row"><button class="big go" data-r="show">👀 Check the sounds</button></div>`);
  const real=t.sounds.filter(s=>!/^\(.*\)$/.test(s)).length;
  const boxes=t.sounds.map((s,i)=>{const sil=/^\(.*\)$/.test(s);return `<span class="${sil?"sil":""}" style="animation-delay:${i*.15}s">${esc(sil?s.slice(1,-1)+" 🤫":s)}</span>`}).join("");
  const r=await card(`<h2>⭐ ${esc(t.word)} has ${real} sounds</h2><div class="boxes">${boxes}</div>
    <div class="row"><button class="big" data-r="no">Not yet</button><button class="big yes" data-r="yes">✔ Got it! +2 ⭐</button></div>`);
  closePop(); if(r==="yes"){ p.stars+=2; sfx.up(); confetti(60); }
}
function breakCard(){ const [icon,move]=pick(BREAKS); let s=15;
  return new Promise(res=>{ showPop(`<h2>🎉 Wiggle Break!</h2><div class="move">${icon}</div><p>${move}</p><div class="timer" id="bt">${s}</div><div class="row"><button class="big go" id="bd">Done! ▶</button></div>`);
    const iv=setInterval(()=>{s--;const e=$("bt");if(e)e.textContent=s>0?s:"✔";if(s<=0)clearInterval(iv);},1000);
    $("bd").onclick=()=>{clearInterval(iv);res();}; }); }
function win(p){
  over=true; busy=false; drawPanel(); sfx.win(); confetti(160); setTimeout(()=>confetti(120),600);
  const scores=players.slice(0,count).map(q=>`<p>${q.icon} ${esc(q.name)}: ⭐ ${q.stars}</p>`).join("");
  showPop(`<h2>🏁 ${p.icon} ${esc(p.name)} wins the race!</h2>${scores}<div class="row"><button class="big go" id="again">Play again</button></div>`);
  $("again").onclick=startScreen;
}

function showPop(h){$("pop").innerHTML=h;$("ov").hidden=false}
function closePop(){$("ov").hidden=true}
function startScreen(){
  showPop(`<h2>🚀 Rocket Ladders</h2><p class="help">Take turns rolling. Land on a word and read it! Reading helps you climb ladders and dodge slides. First to 🏁 wins.</p>
    <div class="row"><button class="big ${count===1?"on":""}" id="c1">1 player</button><button class="big ${count===2?"on":""}" id="c2">2 players</button></div>
    <div class="setup">
      <span style="font-size:2rem" id="i0" role="button" tabindex="0" title="Change icon">${players[0].icon}</span><input id="n0" aria-label="Player 1 name" value="${esc(players[0].name)}">
      ${count===2?`<span style="font-size:2rem" id="i1" role="button" tabindex="0" title="Change icon">${players[1].icon}</span><input id="n1" aria-label="Player 2 name" value="${esc(players[1].name)}">`:""}
    </div>
    <p class="help">Tap an icon to change it.</p>
    <div class="row"><button class="big go" id="go">▶ Start!</button></div>`);
  const save=()=>{players[0].name=$("n0").value.trim()||"Player 1"; if(count===2) players[1].name=$("n1").value.trim()||"Player 2";};
  $("c1").onclick=()=>{save();count=1;startScreen();}; $("c2").onclick=()=>{save();count=2;startScreen();};
  [0,1].forEach(i=>{const el=$("i"+i); if(el) el.onclick=()=>{save();const k=ICONS.indexOf(players[i].icon);players[i].icon=ICONS[(k+1)%ICONS.length];startScreen();};});
  $("go").onclick=()=>{save();newGame();};
}
function newGame(){
  closePop(); over=false; busy=false; turn=0; squareWord={}; tapQueue=[];
  players.forEach(p=>{p.pos=1;p.stars=0;}); $("dice").textContent="🎲"; drawBoard(); drawPanel();
}
function teacher(){
  showPop(`<h2>⚙️ Teacher setup</h2>
    <label class="h" for="ta1">📖 Read words (for regular, ladder and slide squares)</label>
    <textarea id="ta1">${esc(readRaw)}</textarea>
    <label class="h" for="ta2">⭐ Sound Tap words</label>
    <p class="help">One per line: <code>word = sound sound sound</code>. Silent letters in ( ), like <code>hour = (h) ou r</code></p>
    <textarea id="ta2">${esc(tapRaw)}</textarea><p class="help" id="tm"></p>
    <div class="row"><button class="big" id="tDef">Restore Unit 8</button><button class="big" id="tC">Cancel</button><button class="big go" id="tS">Save</button></div>`);
  $("tC").onclick=closePop;
  $("tDef").onclick=()=>{$("ta1").value=READ_DEFAULT;$("ta2").value=TAP_DEFAULT;};
  $("tS").onclick=()=>{const a=$("ta1").value,b=$("ta2").value,r=parseRead(a),t=parseTap(b);
    if(r.length<3){$("tm").textContent="Add at least 3 read words.";return;}
    readRaw=a;tapRaw=b;readWords=r;tapWords=t;try{localStorage.setItem("rl-read",a);localStorage.setItem("rl-tap",b)}catch(e){} newGame();};
}

const cv=$("fx"),cx=cv.getContext("2d");let parts=[];
function size(){cv.width=innerWidth;cv.height=innerHeight} addEventListener("resize",size); size();
function confetti(n){ if(matchMedia("(prefers-reduced-motion: reduce)").matches) return; const c=["#ffd166","#7b5cff","#2e9e5b","#f0742b","#ff4f8b"];
  const st=!parts.length; for(let i=0;i<n;i++) parts.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-4,c:c[i%5],r:Math.random()*6+4,a:1}); if(st) loop(); }
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.a-=.01;cx.globalAlpha=Math.max(p.a,0);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*1.6)});
  parts=parts.filter(p=>p.a>0&&p.y<cv.height+20); if(parts.length) requestAnimationFrame(loop); else cx.clearRect(0,0,cv.width,cv.height);}
